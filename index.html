<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Portfolio | Neil Espinosa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #15151e;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-cyan: #00e5ff;
            --accent-purple: #b300ff;
            --gradient-neon: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Typography */
        h1, h2, h3 {
            color: #ffffff;
            font-weight: 800;
        }

        h2 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            position: relative;
            display: inline-block;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 50%;
            height: 3px;
            background: var(--gradient-neon);
            border-radius: 2px;
        }

        a {
            text-decoration: none;
            color: var(--text-main);
            transition: var(--transition);
        }

        a:hover {
            color: var(--accent-cyan);
        }

        /* Layout & Sections */
        section {
            padding: 100px 10%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        section:not(#hero) {
            min-height: auto;
            padding: 80px 10%;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 10%;
