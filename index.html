<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Portfolio | Neil Espinosa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #15151e;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-cyan: #00e5ff;
            --accent-purple: #b300ff;
            --gradient-neon: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Typography */
        h1, h2, h3 {
            color: #ffffff;
            font-weight: 800;
        }

        h2 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            position: relative;
            display: inline-block;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 50%;
            height: 3px;
            background: var(--gradient-neon);
            border-radius: 2px;
        }

        a {
            text-decoration: none;
            color: var(--text-main);
            transition: var(--transition);
        }

        a:hover {
            color: var(--accent-cyan);
        }

        /* Layout & Sections */
        section {
            padding: 100px 10%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        section:not(#hero) {
            min-height: auto;
            padding: 80px 10%;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--gradient-neon);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Hero Section */
        #hero {
            position: relative;
        }

        .hero-content {
            max-width: 800px;
            animation: fadeInUp 1s ease forwards;
        }

        .hero-greeting {
            color: var(--accent-cyan);
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
            display: block;
            letter-spacing: 2px;
        }

        .hero-name {
            font-size: 4.5rem;
            line-height: 1.1;
            margin-bottom: 10px;
        }

        .hero-tagline {
            font-size: 3rem;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .hero-desc {
            font-size: 1.1rem;
            max-width: 600px;
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        .btn {
            display: inline-block;
            padding: 15px 35px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--bg-dark);
            background: var(--gradient-neon);
            border-radius: 4px;
            position: relative;
            z-index: 1;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 4px;
            background: var(--gradient-neon);
            filter: blur(15px);
            opacity: 0.5;
            z-index: -1;
            transition: var(--transition);
        }

        .btn:hover::before {
            opacity: 1;
            filter: blur(20px);
        }

        .btn:hover {
            color: var(--bg-dark);
            transform: translateY(-2px);
        }

        /* About Section */
        .about-text {
            font-size: 1.1rem;
            color: var(--text-muted);
            max-width: 700px;
        }

        /* Directory Tab System */
        .tabs-container {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }

        .tab-btn:hover {
            border-color: rgba(0, 229, 255, 0.4);
            color: var(--accent-cyan);
        }

        .tab-btn.active {
            background: rgba(0, 229, 255, 0.1);
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.1);
        }

        .tab-content {
            display: none;
            background: var(--bg-card);
            border-radius: 8px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: var(--transition);
            animation: fadeInTab 0.4s ease forwards;
            max-width
